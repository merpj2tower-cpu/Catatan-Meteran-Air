name: Build Catatan Meter Air APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate Gradle Wrapper
        id: locate
        shell: bash
        run: |
          echo "Mencari Gradle Wrapper..."

          WRAPPER=$(find . -type f -name gradlew \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: File gradlew tidak ditemukan!"
            find . -maxdepth 5 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$WRAPPER"

          echo "Gradle Wrapper ditemukan:"
          echo "$WRAPPER"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CatatanMeterAir-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
